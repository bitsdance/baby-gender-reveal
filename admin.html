<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Organiser dashboard | Baby Reveal</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="watermark.css"></head>
<body><main class="shell admin-shell"><div class="watermark" aria-hidden="true"></div><header class="topbar"><span class="brand-mark">✳</span><span>Organiser dashboard</span><a class="top-note" href="/">Guest site</a></header><section class="panel admin-panel"><p class="eyebrow">PRIVATE DASHBOARD</p><h1>Little guesses,<br><span>lots of love.</span></h1><div id="login-box"><p class="admin-intro">Enter your organiser password to view the family’s answers.</p><form id="login-form"><label class="field">Organiser password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Open dashboard <span>→</span></button><p class="error" id="login-error" role="alert"></p></form></div><div id="dashboard" hidden><div class="dashboard-heading"><p class="admin-intro" id="response-count"></p><button class="button primary export-button" id="export-button">Export CSV <span>↓</span></button></div><div id="stats" class="stats"></div><div id="popular" class="popular"></div><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Prediction</th><th>Score</th><th>Submitted</th><th>Answers</th></tr></thead><tbody id="rows"></tbody></table></div><button class="button text-button" id="logout-button">Lock dashboard</button></div></section><footer>Private to the people who love this little one <span>✧</span></footer></main><script src="admin.js" defer></script></body></html>
